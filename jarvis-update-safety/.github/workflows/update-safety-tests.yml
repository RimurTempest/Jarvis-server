
name: JARVIS Update Safety Tests

on:
  push:
    branches:
      - feature/update-safety-foundation
    paths:
      - "jarvis-update-safety/**"
      - ".github/workflows/update-safety-tests.yml"
  pull_request:
    paths:
      - "jarvis-update-safety/**"
      - ".github/workflows/update-safety-tests.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-update-safety
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated tests
        run: node --test test/validate-release.test.mjs
