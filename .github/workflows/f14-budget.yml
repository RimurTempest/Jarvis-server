name: JARVIS F14 budget PostgreSQL checks
on:
  push:
    branches:
      - work/fase14-orcamento-isolado
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node homolog-f14/test/postgres-budget.mjs
        env:
          JARVIS_TEST_DATABASE_URL: postgres://jarvis_test:local_test_only@localhost:5432/jarvis_test
