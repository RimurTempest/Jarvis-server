name: JARVIS live health verification
on:
  pull_request:
    paths:
      - '.github/workflows/live-health-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://jarvis-server-odpk.onrender.com/health -o /tmp/jarvis-health.json
          node -e 'const f=require("fs"); const h=JSON.parse(f.readFileSync("/tmp/jarvis-health.json","utf8")); if(h.status!=="ok") { console.error("Saúde não confirmada"); process.exit(1); } console.log(JSON.stringify({status:h.status, revision:h.revision, database:h.database, aiProviders:h.aiProviders, webSearchConfigured:h.webSearchConfigured, persistentLearningMemory:h.persistentLearningMemory}));'
