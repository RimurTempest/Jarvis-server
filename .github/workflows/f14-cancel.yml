name: JARVIS F14 cancellation checks
on:
  push:
    branches:
      - work/fase14-heartbeat-cancelamento
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test homolog-f14/test/cancellable-process.test.cjs homolog-f14/test/worker-cancellation.test.cjs
