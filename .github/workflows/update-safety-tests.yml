name: JARVIS Update Safety Tests

on:
  push:
    branches:
      - feature/update-safety-foundation
    paths:
      - "server.js"
      - "behavior.js"
      - "package.json"
      - "jarvis-update-safety/**"
      - ".github/workflows/update-safety-tests.yml"
  pull_request:
    paths:
      - "server.js"
      - "behavior.js"
      - "package.json"
      - "jarvis-update-safety/**"
      - ".github/workflows/update-safety-tests.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax and run regression-safety tests
        run: |
          npm run check:syntax
          npm run test:safety
