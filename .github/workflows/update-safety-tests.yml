name: JARVIS Update Safety Tests

on:
  push:
    branches:
      - main
      - feature/update-safety-foundation
      - feature/executable-capabilities-foundation
    paths:
      - "server.js"
      - "behavior.js"
      - "package.json"
      - "jarvis-update-safety/**"
      - "jarvis-capabilities/**"
      - ".github/workflows/update-safety-tests.yml"
  pull_request:
    paths:
      - "server.js"
      - "behavior.js"
      - "package.json"
      - "jarvis-update-safety/**"
      - "jarvis-capabilities/**"
      - ".github/workflows/update-safety-tests.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-update-safety
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check ../server.js
          node --check ../behavior.js
          node --check validate-release.mjs
          node --check test/validate-release.test.mjs
          node --check ../jarvis-capabilities/capability-registry.mjs
          node --check ../jarvis-capabilities/learning-intent.mjs
          node --check ../jarvis-capabilities/android-action-protocol.mjs
          node --check ../jarvis-capabilities/test/capability-registry.test.mjs
          node --check ../jarvis-capabilities/test/learning-intent.test.mjs
          node --check ../jarvis-capabilities/test/android-action-protocol.test.mjs

      - name: Run automated tests
        run: |
          node --test test/validate-release.test.mjs
          node --test ../jarvis-capabilities/test/capability-registry.test.mjs
          node --test ../jarvis-capabilities/test/learning-intent.test.mjs
          node --test ../jarvis-capabilities/test/android-action-protocol.test.mjs
